<style>
  :root{
    --navy:#0b2a52;
    --navy-deep:#071c38;
    --blue:#0d5aa7;
    --azure:#1c9fd9;
    --gold:#d6a22c;
    --gold-light:#f0c85a;
    --bg:#f5f8fc;
    --ink:#1b2536;
    --ink-soft:#4a5568;
    --card:#ffffff;
    --radius:16px;
    --shadow:0 10px 30px rgba(11,42,82,.10);
    --shadow-lg:0 18px 45px rgba(11,42,82,.18);
  }

  *{margin:0;padding:0;box-sizing:border-box;}

  html{scroll-behavior:smooth;}

  body{
    font-family:'Noto Sans Devanagari','Poppins',Arial,sans-serif;
    background:var(--bg);
    color:var(--ink);
    line-height:1.7;
    overflow-x:hidden;
  }

  h1,h2,h3{font-family:'Baloo Bhai 2','Noto Sans Devanagari',Arial,sans-serif;}

  img{max-width:100%;display:block;}

  a{color:inherit;}

  :focus-visible{outline:3px solid var(--gold);outline-offset:2px;}

  .wrap{max-width:1140px;margin:auto;padding:0 20px;}

  /* ============ HEADER ============ */
  header{
    background:linear-gradient(120deg,var(--navy-deep),var(--navy) 55%,var(--blue));
    color:#fff;
    padding:14px 20px;
    position:sticky;
    top:0;
    z-index:1000;
    box-shadow:0 4px 18px rgba(0,0,0,.15);
  }

  nav{
    max-width:1140px;
    margin:auto;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:12px;
  }

  .logo{
    font-family:'Baloo Bhai 2',sans-serif;
    font-size:22px;
    font-weight:800;
    display:flex;
    align-items:center;
    gap:8px;
    letter-spacing:.3px;
  }

  .logo .chakra{
    width:26px;height:26px;
    border:2.5px solid var(--gold-light);
    border-radius:50%;
    position:relative;
    flex:none;
  }
  .logo .chakra::before,.logo .chakra::after{
    content:"";position:absolute;background:var(--gold-light);
  }
  .logo .chakra::before{width:2px;height:26px;left:50%;top:-2px;transform:translateX(-50%);}
  .logo .chakra::after{height:2px;width:26px;top:50%;left:-2px;transform:translateY(-50%);}

  .navlinks{display:flex;flex-wrap:wrap;align-items:center;gap:4px;}

  .navlinks a{
    color:#eaf3ff;
    text-decoration:none;
    margin-left:6px;
    font-size:14.5px;
    font-weight:500;
    padding:8px 12px;
    border-radius:20px;
    transition:.25s;
    white-space:nowrap;
  }
  .navlinks a:hover,.navlinks a:focus-visible{background:rgba(255,255,255,.14);color:var(--gold-light);}

  .nav-toggle{
    display:none;
    background:none;border:none;color:#fff;font-size:26px;cursor:pointer;
  }

  /* ============ HERO ============ */
  .hero{
    position:relative;
    background:radial-gradient(circle at 80% 20%,rgba(214,162,44,.25),transparent 55%),
               linear-gradient(135deg,var(--navy-deep),var(--blue) 65%,var(--azure));
    color:#fff;
    text-align:center;
    padding:90px 20px 80px;
    overflow:hidden;
  }

  .hero .bg-chakra{
    position:absolute;
    top:50%;left:50%;
    width:640px;height:640px;
    transform:translate(-50%,-50%);
    border:2px solid rgba(255,255,255,.07);
    border-radius:50%;
    pointer-events:none;
  }
  .hero .bg-chakra::before{
    content:"";position:absolute;inset:60px;
    border:2px solid rgba(255,255,255,.06);border-radius:50%;
  }

  .hero-inner{position:relative;z-index:1;}

  .eyebrow{
    display:inline-block;
    font-size:13px;
    letter-spacing:2px;
    font-weight:600;
    color:var(--gold-light);
    background:rgba(255,255,255,.08);
    padding:6px 16px;
    border-radius:20px;
    margin-bottom:18px;
    font-family:'Poppins',sans-serif;
  }

  .hero h1{
    font-size:clamp(30px,5vw,50px);
    font-weight:800;
    margin-bottom:8px;
    text-shadow:0 3px 18px rgba(0,0,0,.25);
  }

  .hero h2{
    font-size:clamp(15px,2.4vw,20px);
    font-weight:600;
    letter-spacing:1.5px;
    color:var(--gold-light);
    margin-bottom:18px;
    font-family:'Poppins',sans-serif;
  }

  .hero p{max-width:640px;margin:auto;font-size:17px;color:#e7f0fb;}

  .buttons{margin-top:30px;display:flex;flex-wrap:wrap;gap:12px;justify-content:center;}

  .btn{
    display:inline-flex;
    align-items:center;
    gap:8px;
    padding:13px 26px;
    border-radius:30px;
    text-decoration:none;
    font-weight:700;
    font-size:15px;
    background:#fff;
    color:var(--navy);
    border:2px solid transparent;
    cursor:pointer;
    transition:.25s;
    font-family:'Noto Sans Devanagari',Arial,sans-serif;
  }
  .btn:hover{transform:translateY(-3px);box-shadow:0 10px 24px rgba(0,0,0,.2);}

  .btn-gold{background:linear-gradient(135deg,var(--gold),var(--gold-light));color:var(--navy-deep);}

  .btn-outline{background:transparent;color:#fff;border-color:rgba(255,255,255,.6);}
  .btn-outline:hover{background:rgba(255,255,255,.12);}

  /* ============ SECTIONS ============ */
  .section{max-width:1140px;margin:auto;padding:70px 20px;}

  .section .eyebrow-line{
    text-align:center;font-size:13px;letter-spacing:2px;font-weight:700;
    color:var(--azure);font-family:'Poppins',sans-serif;margin-bottom:8px;
  }

  .section h2{
    text-align:center;
    margin-bottom:14px;
    color:var(--navy);
    font-size:clamp(24px,3.4vw,32px);
    font-weight:800;
  }

  .section-sub{
    text-align:center;
    max-width:620px;
    margin:0 auto 40px;
    color:var(--ink-soft);
    font-size:15.5px;
  }

  .mission{
    background:var(--card);
    border-radius:var(--radius);
    padding:36px 30px;
    text-align:center;
    box-shadow:var(--shadow);
    border-top:4px solid var(--gold);
  }

  .mission strong{color:var(--navy);font-size:17px;}

  /* ============ CARDS / GRID ============ */
  .cards{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:22px;
  }

  .card{
    background:var(--card);
    padding:28px 24px;
    border-radius:var(--radius);
    text-align:center;
    box-shadow:var(--shadow);
    transition:.3s;
    border-bottom:3px solid transparent;
    cursor:default;
  }

  .card.clickable{cursor:pointer;}

  .card:hover{transform:translateY(-6px);box-shadow:var(--shadow-lg);border-bottom-color:var(--gold);}

  .card .icon{
    font-size:38px;margin-bottom:12px;
    width:70px;height:70px;line-height:70px;
    border-radius:50%;
    background:linear-gradient(135deg,#eaf5ff,#dff0ff);
    margin:0 auto 14px;
  }

  .card h3{color:var(--navy);margin-bottom:8px;font-size:18px;}

  .card p{color:var(--ink-soft);font-size:14.5px;}

  .card .tap-hint{
    display:inline-block;margin-top:12px;font-size:12.5px;font-weight:700;
    color:var(--azure);font-family:'Poppins',sans-serif;
  }

  /* ============ MODAL (Knowledge / Gallery) ============ */
  .modal-box-overlay{
    display:none;
    position:fixed;inset:0;z-index:2000;
    background:rgba(6,20,40,.72);
    align-items:center;justify-content:center;
    padding:20px;
  }
  .modal-box-overlay.open{display:flex;}

  .modal-panel{
    background:#fff;
    width:100%;
    max-width:720px;
    max-height:88vh;
    overflow-y:auto;
    border-radius:20px;
    padding:34px 30px;
    position:relative;
    box-shadow:0 20px 60px rgba(0,0,0,.35);
  }

  .modal-panel h2{color:var(--navy);margin-bottom:16px;font-size:24px;}
  .modal-panel h3{color:var(--blue);margin:22px 0 10px;font-size:17px;}
  .modal-panel p{color:#333;line-height:1.85;}
  .modal-panel ul{padding-left:20px;}
  .modal-panel li{margin:10px 0;line-height:1.65;}
  .modal-panel li b{color:var(--navy);}

  .close-btn{
    position:absolute;right:16px;top:16px;
    border:none;background:var(--navy);color:#fff;
    border-radius:50%;width:38px;height:38px;font-size:16px;cursor:pointer;
    transition:.2s;
  }
  .close-btn:hover{background:#c0392b;transform:rotate(90deg);}

  /* ============ GALLERY ============ */
  .gallery-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:20px;
  }

  .gallery-item{
    position:relative;
    border-radius:var(--radius);
    overflow:hidden;
    aspect-ratio:4/3;
    cursor:pointer;
    box-shadow:var(--shadow);
    border:3px solid #fff;
  }

  .gallery-item .thumb{
    width:100%;height:100%;
    display:flex;align-items:center;justify-content:center;
    font-size:44px;color:#fff;
    background:linear-gradient(135deg,var(--navy),var(--azure));
    transition:.35s;
  }

  .gallery-item:nth-child(2) .thumb{background:linear-gradient(135deg,var(--blue),var(--gold));}
  .gallery-item:nth-child(3) .thumb{background:linear-gradient(135deg,var(--navy-deep),var(--blue));}
  .gallery-item:nth-child(4) .thumb{background:linear-gradient(135deg,var(--gold),#8a5a12);}
  .gallery-item:nth-child(5) .thumb{background:linear-gradient(135deg,var(--azure),var(--navy));}
  .gallery-item:nth-child(6) .thumb{background:linear-gradient(135deg,#0d5aa7,#071c38);}

  .gallery-item:hover .thumb{transform:scale(1.08);}

  .gallery-caption{
    position:absolute;left:0;right:0;bottom:0;
    background:linear-gradient(0deg,rgba(0,0,0,.72),transparent);
    color:#fff;font-size:13.5px;font-weight:600;
    padding:22px 12px 10px;
    text-align:center;
  }

  .gallery-note{
    text-align:center;color:var(--ink-soft);font-size:13.5px;margin-top:20px;
  }

  /* ============ QUIZ ============ */
  .quiz-box{
    background:var(--card);
    border-radius:var(--radius);
    padding:34px 28px;
    box-shadow:var(--shadow);
    border-top:4px solid var(--azure);
  }

  .quiz-progress{
    text-align:center;font-size:13.5px;font-weight:700;color:var(--azure);
    font-family:'Poppins',sans-serif;letter-spacing:.5px;margin-bottom:18px;
  }

  .quiz-q{
    border-bottom:1px solid #e6edf5;
    padding:20px 0;
  }
  .quiz-q:first-child{padding-top:0;}
  .quiz-q:last-child{border-bottom:none;}

  .quiz-q .q-title{
    font-weight:700;color:var(--navy);margin-bottom:12px;font-size:15.5px;
  }

  .quiz-q .options{display:grid;gap:9px;}

  .quiz-q label{
    display:flex;align-items:center;gap:10px;
    background:#f5f8fc;
    border:1.5px solid #e2e9f2;
    border-radius:10px;
    padding:10px 14px;
    font-size:14.5px;
    cursor:pointer;
    transition:.2s;
  }
  .quiz-q label:hover{border-color:var(--azure);}
  .quiz-q label.correct{background:#e6f7ec;border-color:#2e8b57;font-weight:700;}
  .quiz-q label.wrong{background:#fdeaea;border-color:#c0392b;}

  .quiz-q input[type=radio]{accent-color:var(--blue);width:16px;height:16px;flex:none;}

  .quiz-actions{text-align:center;margin-top:26px;display:flex;gap:12px;justify-content:center;flex-wrap:wrap;}

  .quiz-btn{
    border:none;padding:13px 30px;border-radius:30px;font-weight:700;font-size:15px;
    cursor:pointer;font-family:'Noto Sans Devanagari',Arial,sans-serif;transition:.25s;
  }
  .quiz-submit{background:linear-gradient(135deg,var(--blue),var(--azure));color:#fff;}
  .quiz-submit:hover{transform:translateY(-2px);box-shadow:0 10px 22px rgba(13,90,167,.3);}
  .quiz-reset{background:#eef2f7;color:var(--navy);}
  .quiz-reset:hover{background:#e2e9f2;}

  .quiz-result{
    text-align:center;margin-top:22px;padding:20px;border-radius:14px;
    background:linear-gradient(135deg,#eaf5ff,#f5f8fc);
    font-size:17px;font-weight:700;color:var(--navy);display:none;
  }

  /* ============ JOIN MISSION ============ */
  .join{
    background:linear-gradient(135deg,var(--navy-deep),var(--blue) 70%,var(--azure));
    color:#fff;
    text-align:center;
    border-radius:22px;
    padding:50px 26px;
    position:relative;
    overflow:hidden;
  }

  .join::before{
    content:"";position:absolute;width:380px;height:380px;
    border:2px solid rgba(255,255,255,.08);border-radius:50%;
    top:-120px;right:-120px;
  }

  .join h2{color:#fff;margin-bottom:10px;}
  .join > p{max-width:520px;margin:0 auto 8px;color:#e7f0fb;}

  .join-reasons{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:16px;
    max-width:820px;
    margin:32px auto;
    position:relative;
    z-index:1;
  }

  .join-reason{
    background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.15);
    border-radius:14px;
    padding:18px 14px;
    font-size:14px;
  }
  .join-reason .r-icon{font-size:26px;margin-bottom:8px;}

  /* ============ RULES ============ */
  .rules{
    background:var(--card);
    padding:32px 30px;
    border-radius:var(--radius);
    box-shadow:var(--shadow);
  }

  .rules ul{display:grid;gap:12px;}

  .rules li{
    list-style:none;
    font-size:15px;
    padding:12px 16px;
    background:#f5f8fc;
    border-radius:10px;
    border-left:4px solid var(--azure);
  }

  /* ============ CONTACT / SOCIAL ============ */
  .social-row{
    display:flex;flex-wrap:wrap;gap:14px;justify-content:center;margin-top:22px;
  }

  .social-btn{
    display:inline-flex;align-items:center;gap:9px;
    padding:12px 22px;border-radius:30px;
    text-decoration:none;font-weight:700;font-size:14.5px;
    color:#fff;transition:.25s;
  }
  .social-btn:hover{transform:translateY(-3px);box-shadow:0 10px 22px rgba(0,0,0,.18);}
  .social-whatsapp{background:#25d366;}
  .social-instagram{background:linear-gradient(135deg,#f58529,#dd2a7b,#8134af,#515bd4);}
  .social-facebook{background:#1877f2;}

  /* ============ FOOTER ============ */
  footer{
    background:var(--navy-deep);
    color:#dfe9f6;
    text-align:center;
    padding:40px 20px 26px;
  }

  footer h3{color:#fff;margin-bottom:6px;}

  footer .foot-social{margin:18px 0;display:flex;justify-content:center;gap:16px;}
  footer .foot-social a{
    width:38px;height:38px;border-radius:50%;
    background:rgba(255,255,255,.1);
    display:flex;align-items:center;justify-content:center;
    text-decoration:none;font-size:17px;transition:.2s;
  }
  footer .foot-social a:hover{background:var(--gold);}

  footer .fine{margin-top:16px;font-size:12.5px;color:#8ea3c0;}

  /* ============ REGISTRATION MODAL ============ */
  .modal-overlay{
    position:fixed;inset:0;
    background:rgba(6,20,40,.68);
    display:flex;align-items:center;justify-content:center;
    z-index:2100;padding:16px;
  }

  .modal-box{
    background:#fff;border-radius:20px;max-width:420px;width:100%;
    max-height:90vh;overflow-y:auto;padding:30px 26px;
    box-shadow:0 20px 60px rgba(0,0,0,.3);position:relative;
  }

  .modal-box h2{color:var(--navy);font-size:22px;margin-bottom:6px;text-align:center;}
  .modal-box .modal-sub{text-align:center;color:#555;font-size:14px;margin-bottom:20px;}

  .modal-box label{display:block;font-size:13px;font-weight:700;color:var(--navy);margin:14px 0 5px;}

  .modal-box input,.modal-box select{
    width:100%;padding:11px 12px;border:1.5px solid #d5dde8;border-radius:10px;
    font-size:15px;font-family:inherit;color:#222;
  }
  .modal-box input:focus,.modal-box select:focus{outline:none;border-color:var(--azure);}

  .modal-submit{
    width:100%;margin-top:22px;padding:13px;border:none;border-radius:25px;
    background:linear-gradient(135deg,var(--blue),var(--azure));color:#fff;
    font-weight:700;font-size:15px;cursor:pointer;font-family:inherit;
  }
  .modal-submit:hover{filter:brightness(1.05);}

  .modal-skip{
    display:block;text-align:center;margin-top:14px;font-size:13px;color:#888;
    text-decoration:underline;cursor:pointer;background:none;border:none;font-family:inherit;
  }

  .form-error{color:#c0392b;font-size:13px;margin-top:6px;display:none;}

  /* ============ SHARE BUTTON / MODAL ============ */
  .nav-share-btn{
    display:inline-flex;align-items:center;gap:6px;
    background:rgba(255,255,255,.12);
    border:1px solid rgba(255,255,255,.3);
    color:#fff;font-size:13.5px;font-weight:600;
    padding:8px 14px;border-radius:20px;
    cursor:pointer;margin-left:10px;
    font-family:'Noto Sans Devanagari',Arial,sans-serif;
    transition:.25s;white-space:nowrap;
  }
  .nav-share-btn:hover{background:var(--gold);color:var(--navy-deep);border-color:var(--gold);}

  .fab-share{
    position:fixed;
    right:18px;bottom:18px;
    z-index:1500;
    background:linear-gradient(135deg,var(--blue),var(--azure));
    color:#fff;border:none;
    width:56px;height:56px;border-radius:50%;
    font-size:23px;cursor:pointer;
    box-shadow:0 10px 26px rgba(11,42,82,.35);
    display:flex;align-items:center;justify-content:center;
    transition:.25s;
  }
  .fab-share:hover{transform:translateY(-3px) scale(1.05);}
